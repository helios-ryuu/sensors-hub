---
# ClusterRole cho Prometheus để đọc pod metadata (kubernetes_sd)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: thermal-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: thermal-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: thermal-prometheus
subjects:
  - kind: ServiceAccount
    name: thermal-prometheus
    namespace: thermal-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thermal-prometheus
  namespace: thermal-monitoring

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-renderer
  namespace: thermal-monitoring
  labels:
    app: grafana-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-renderer
  template:
    metadata:
      labels:
        app: grafana-renderer
    spec:
      nodeSelector:
        role: monitoring
      containers:
        - name: renderer
          image: grafana/grafana-image-renderer:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: ENABLE_METRICS
              value: "false"
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thermal-secrets
                  key: grafana-renderer-token
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-renderer
  namespace: thermal-monitoring
spec:
  selector:
    app: grafana-renderer
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP

apiVersion: v1
kind: Secret
metadata:
  name: thermal-secrets
  namespace: thermal-monitoring
type: Opaque
stringData:
  # Bắt buộc: thay bằng mật khẩu thực
  grafana-admin-password: "CHANGE_THIS_ADMIN_PASSWORD"
  # Token kết nối nội bộ Grafana <-> Image Renderer
  grafana-renderer-token: "thermal-renderer-secret-token-1511"
